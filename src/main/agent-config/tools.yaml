version: 1
tools:
  - type: function
    function:
      name: run_shell
      description: 执行 Windows 命令行命令，返回输出结果。仅限只读/安全命令，禁止删除系统文件等危险操作。
      parameters:
        type: object
        properties:
          command:
            type: string
            description: 要执行的命令，如 dir、ipconfig、node -v 等
          timeout:
            type: number
            description: 超时时间（毫秒），默认 15000
            default: 15000
        required:
          - command
  - type: function
    function:
      name: read_file
      description: 读取文件内容，返回文本。支持：纯文本/代码/日志/配置（utf8）、PDF（.pdf，自动提取文字）、Word（.docx，自动提取正文）。二进制文件（exe/图片等）不支持。
      parameters:
        type: object
        properties:
          path:
            type: string
            description: 文件绝对路径
        required:
          - path
  - type: function
    function:
      name: write_file
      description: 写入文本文件，覆盖已有内容。用于保存配置、生成脚本等。
      parameters:
        type: object
        properties:
          path:
            type: string
            description: 文件绝对路径
          content:
            type: string
            description: 要写入的文本内容
        required:
          - path
          - content
  - type: function
    function:
      name: get_system_info
      description: 获取当前系统信息（操作系统、CPU、内存、Node版本、应用版本等）。
  - type: function
    function:
      name: pet_action
      description: 触发桌宠（虚拟宠物）做动作或表情。注意：桌宠≠桌面分身，两者完全无关。
      parameters:
        type: object
        properties:
          action:
            type: string
            description: 动作名称，如 shy、happy、sad 等
        required:
          - action
  - type: function
    function:
      name: web_search
      description: 使用搜索引擎搜索网络信息，返回搜索结果列表。用于查询最新资讯、技术文档、百科知识等需要外部信息的任务。
      parameters:
        type: object
        properties:
          query:
            type: string
            description: 搜索关键词，如 "electron updater 教程"、"今天天气" 等
          max_results:
            type: number
            description: 返回结果数量，默认 8，最多 20
            default: 8
        required:
          - query
  - type: function
    function:
      name: web_fetch
      description: 抓取指定 URL 的网页内容，返回页面文本。用于读取具体网页、文档、博客文章等详细内容。
      parameters:
        type: object
        properties:
          url:
            type: string
            description: 要抓取的网页 URL，必须以 http:// 或 https:// 开头
          max_length:
            type: number
            description: 返回内容最大长度，默认 8000 字符
            default: 8000
        required:
          - url
  - type: function
    function:
      name: http_request
      description: 发送 HTTP 请求（GET/POST/PUT/DELETE），返回响应状态和内容。用于调用 API、测试接口等。
      parameters:
        type: object
        properties:
          url:
            type: string
            description: 请求 URL
          method:
            type: string
            description: 请求方法，GET/POST/PUT/DELETE，默认 GET
            default: GET
          headers:
            type: object
            description: "请求头，如 {\"Content-Type\": \"application/json\"}"
          body:
            type: string
            description: 请求体内容
          timeout:
            type: number
            description: 超时时间（毫秒），默认 15000
            default: 15000
        required:
          - url
  - type: function
    function:
      name: file_search
      description: 在指定目录中搜索文件，支持按名称、扩展名过滤。用于查找项目文件、配置文件、日志等。
      parameters:
        type: object
        properties:
          directory:
            type: string
            description: 搜索的根目录绝对路径
          pattern:
            type: string
            description: 文件名匹配模式，支持通配符 *，如 "*.js"、"config*"
          max_results:
            type: number
            description: 最大返回结果数，默认 50
            default: 50
        required:
          - directory
          - pattern
  - type: function
    function:
      name: directory_list
      description: 列出指定目录下的文件和子目录，返回名称、大小、修改时间等信息。
      parameters:
        type: object
        properties:
          path:
            type: string
            description: 目录绝对路径
          show_hidden:
            type: boolean
            description: 是否显示隐藏文件，默认 false
            default: false
        required:
          - path
  - type: function
    function:
      name: copy_file
      description: 复制文件或目录到目标位置。
      parameters:
        type: object
        properties:
          source:
            type: string
            description: 源文件或目录绝对路径
          destination:
            type: string
            description: 目标文件或目录绝对路径
          overwrite:
            type: boolean
            description: 是否覆盖已存在文件，默认 false
            default: false
        required:
          - source
          - destination
  - type: function
    function:
      name: move_file
      description: 移动或重命名文件/目录。
      parameters:
        type: object
        properties:
          source:
            type: string
            description: 源文件或目录绝对路径
          destination:
            type: string
            description: 目标文件或目录绝对路径
        required:
          - source
          - destination
  - type: function
    function:
      name: create_directory
      description: 创建目录，支持递归创建多级目录。
      parameters:
        type: object
        properties:
          path:
            type: string
            description: 要创建的目录绝对路径
        required:
          - path
  - type: function
    function:
      name: download_file
      description: 从 URL 下载文件到本地指定路径。
      parameters:
        type: object
        properties:
          url:
            type: string
            description: 文件下载 URL
          destination:
            type: string
            description: 保存的本地绝对路径
          timeout:
            type: number
            description: 超时时间（毫秒），默认 60000
            default: 60000
        required:
          - url
          - destination
  - type: function
    function:
      name: get_current_time
      description: 获取当前日期和时间，返回格式化的时间字符串。
  - type: function
    function:
      name: calculator
      description: 执行数学计算，支持加减乘除、幂运算、括号等复杂表达式。如 "2+3*4"、"(10-5)/2"、"Math.sqrt(16)"。
      parameters:
        type: object
        properties:
          expression:
            type: string
            description: 数学表达式，如 "2+3*4"、"Math.PI * 10^2"
        required:
          - expression
  - type: function
    function:
      name: check_url
      description: 检查 URL 是否可访问，返回 HTTP 状态码和响应时间。用于验证链接有效性、测试网站可用性。
      parameters:
        type: object
        properties:
          url:
            type: string
            description: 要检查的 URL
          timeout:
            type: number
            description: 超时时间（毫秒），默认 10000
            default: 10000
        required:
          - url
  - type: function
    function:
      name: open_url
      description: 在默认浏览器中打开指定 URL。
      parameters:
        type: object
        properties:
          url:
            type: string
            description: 要打开的网页 URL
        required:
          - url
  - type: function
    function:
      name: todo_write
      description: 【需求整理·先做这一步】把用户的需求整理成一份待办清单并整表替换（首次规划、需求变更都用它）。每条必须写清"做到什么算完成"(done_when)，把模糊说法翻译成可验证的目标；这样用户能一眼确认你要做什么、怎么算做完。
      parameters:
        type: object
        properties:
          title:
            type: string
            description: 这次任务的一句话目标（便于用户确认），如"修复窄窗下工具栏按钮被裁"
          items:
            type: array
            description: 待办条目（3~7 条最佳，最多 12 条）。按执行顺序排列。
            items:
              type: object
              properties:
                text:
                  type: string
                  description: 要做的事，动词开头、具体可执行；禁止"优化一下""处理相关问题"这类空话
                status:
                  type: string
                  description: pending(待办) / in_progress(进行中，全局只能一条) / completed(已完成)
                  default: pending
                done_when:
                  type: string
                  description: 完成判据：怎么算做完了（可观测、可验证），如"900px 窗口下 4 个按钮都完整可见"
                note:
                  type: string
                  description: 补充说明或已完成的证据（如截图路径、验证结论）
                id:
                  type: string
                  description: 已有条目的 id（更新时带上，保持条目身份稳定）
              required:
                - text
        required:
          - items
  - type: function
    function:
      name: todo_update
      description: 更新**单条**待办的状态/说明（日常推进进度用它，比整表重写省 token）。完成一条立刻标记，note 里写清结果或证据。传 status=in_progress 时其它进行中的会自动退回待办。
      parameters:
        type: object
        properties:
          id:
            type: string
            description: 待办 id（todo_write / todo_read 返回的 id）
          text:
            type: string
            description: 没有 id 时用原文定位
          status:
            type: string
            description: pending / in_progress / completed
          note:
            type: string
            description: 结果说明或证据（如"已改 style.css 的 .panel-actions，验证 0 溢出"）
          done_when:
            type: string
            description: 修正完成判据
  - type: function
    function:
      name: todo_read
      description: 读取当前会话的待办清单与进度。开始一轮工作前确认"上一轮做到哪了"，或不确定条目 id 时用它。
      parameters:
        type: object
        properties: {}
  - type: function
    function:
      name: ask_user
      description: 【每条待办动手前用】就"这条待办怎么做"询问用户：给出 2~4 个具体可行的方案选项让用户挑，用户也可以自定义输入自己的做法。问的是具体做法的选择，不是"可以开始吗"这类空泛确认。拿到用户的选择后严格按它执行。
      parameters:
        type: object
        properties:
          question:
            type: string
            description: 要问的问题：说清这条待办要达成什么、在哪个点上有分叉需要用户拿主意
          options:
            type: array
            items:
              type: string
            description: 2~4 个具体做法选项，每个一句话讲清做法与效果/代价，让用户能一眼比出来
          allow_custom:
            type: boolean
            description: 是否允许用户自定义输入，默认允许
            default: true
        required:
          - question
          - options
  - type: function
    function:
      name: memory_save
      description: 把「跨会话仍然成立」的信息写入长期记忆，之后每次对话都会自动带上。适合记：用户偏好与习惯、项目约定与硬规则、环境限制、踩过的坑与修复结论。不要记闲聊、一次性任务、或能直接从代码/文件里读到的内容。
      parameters:
        type: object
        properties:
          text:
            type: string
            description: 要记住的内容，一句话讲清楚（不超过 500 字）
          tags:
            type: array
            items:
              type: string
            description: 检索标签，如 ["electron","UI","用户偏好"]
          kind:
            type: string
            description: "类型: fact(事实) / preference(偏好) / project(项目) / fix(修复经验) / note(备注)"
            default: note
          pinned:
            type: boolean
            description: 置顶后必定注入系统提示词（慎用，只给几条最关键的）
            default: false
          id:
            type: string
            description: 要覆盖的已有记忆 id（先用 memory_search 拿到），不传则新增
        required:
          - text
  - type: function
    function:
      name: memory_search
      description: 在长期记忆里按关键词检索，返回命中的记忆条目、id、标签与相关度。修改/删除记忆前先用它拿到 id。
      parameters:
        type: object
        properties:
          query:
            type: string
            description: 检索关键词，如 "electron 透明"、"用户偏好"
          limit:
            type: number
            description: 最多返回条数，默认 10
            default: 10
        required:
          - query
  - type: function
    function:
      name: memory_list
      description: 列出长期记忆（置顶优先、最近更新在前），可按标签或类型过滤。用于确认"我已经记了什么"。
      parameters:
        type: object
        properties:
          tag:
            type: string
            description: 按标签过滤
          kind:
            type: string
            description: "按类型过滤: fact / preference / project / fix / note"
          limit:
            type: number
            description: 最多返回条数，默认 50
            default: 50
  - type: function
    function:
      name: memory_delete
      description: 删除长期记忆：给 id 删单条；给 query 则删掉关键词命中的若干条（如"忘掉关于 X 的记忆"）。
      parameters:
        type: object
        properties:
          id:
            type: string
            description: 要删除的记忆 id
          query:
            type: string
            description: 按关键词删除（与 id 二选一）
          limit:
            type: number
            description: 按关键词删除时的最大条数，默认 10
            default: 10
  - type: function
    function:
      name: capture_window
      description: >-
        截取「需要验证的那个程序」的窗口画面并存成 PNG，返回文件路径。⚠️ 默认目标：若你刚用 launch_project
        启动过被测项目，则自动抓「被测程序」的窗口（不传参即可）；否则抓本应用自己的窗口（改本程序界面时用）。要抓其它程序可传 title 指定窗口标题关键字。
      parameters:
        type: object
        properties:
          which:
            type: string
            description: "抓本应用哪个窗口: main(主窗口, 默认) / pet(桌宠) / editor / debugLog，也可传窗口标题片段。（仅在没传 title 且没有已启动的被测程序时生效）"
          title:
            type: string
            description: 抓其它程序的窗口：窗口标题关键字（传了 title 就忽略 which 与被测程序默认值）
          index:
            type: number
            description: 标题匹配到多个窗口时取第几个，默认 0
          save_path:
            type: string
            description: 保存路径（绝对路径或文件名）。省略时：已选项目工作目录则存到 <项目>/screenshots/ 下自动命名，未选项目则存到 数据目录/screenshots/
  - type: function
    function:
      name: verify_ui
      description: >-
        【修复自验证·必用】验证界面改动是否生效，返回 pass/warn/fail。两种用法：① 不传 title → 验证「本应用」的窗口（量真实布局 + 截图 + 视觉复核），能查出元素被裁切/遮挡/溢出/尺寸塌陷；② 传
        title → 验证「外部程序」的窗口（如用户的项目/游戏/浏览器里跑的页面）：抓取对方窗口画面交给视觉模型判断缺陷（外部窗口无法注入布局自检，靠视觉复核）。⚠️ 要验证的画面在别的程序窗口里时必须传
        title，不要截自己应用的页面充数。
      parameters:
        type: object
        properties:
          title:
            type: string
            description: 验证「外部程序」时的窗口标题关键字，如 "贪吃蛇"（游戏/网页在别的窗口运行时必传，传了就按外部程序流程走）
          index:
            type: number
            description: title 匹配到多个窗口时取第几个，默认 0
          selectors:
            type: array
            items:
              type: string
            description: 只验证这些 CSS 选择器（含子树），如 ["#btn-clear-chat"]；仅本应用窗口有效；留空则扫描整页
          checks:
            type: array
            items:
              type: string
            description: 要跑的检查项，默认 ["clipped","overflow-hidden","out-of-viewport"]，可加 "occluded"(控件被遮挡)、"zero-size"(尺寸塌陷)；仅本应用窗口有效
          which:
            type: string
            description: 验证本应用哪个窗口，默认 main（与 title 互斥，传了 title 以 title 为准）
          screenshot:
            type: boolean
            description: 是否同时截图留证，默认 true
            default: true
          analyze:
            type: boolean
            description: 是否再让视觉模型看图复核（需要配置视觉模型），默认 true
            default: true
          expect:
            type: string
            description: 本次改动期望达到的效果，交给视觉模型对照判断，如"蛇身完整显示，无方块化异常"
  - type: function
    function:
      name: analyze_screenshot
      description: 让视觉模型看一张截图并回答具体问题。用于"量不出来只能靠看"的问题：错位、颜色不对、图标丢失、被遮挡、排版混乱、文字被截断。需要提供商支持视觉模型（如 qwen-vl-max / gpt-4o / glm-4v）。
      parameters:
        type: object
        properties:
          question:
            type: string
            description: 要模型重点判断什么，越具体越好，如"清空按钮是否完整可见、有没有被右边缘切掉"
          image_path:
            type: string
            description: 图片绝对路径；不传则用最近一次截图
          provider_id:
            type: string
            description: 用哪个提供商（可选，默认跟随当前激活模型）
          model:
            type: string
            description: 视觉模型名（可选，默认按提供商推断）
        required:
          - question
  - type: function
    function:
      name: control_computer
      description: >-
        【操作电脑/桌面分身】优先操作桌面分身（右下角悬浮窗）：桌面分身已打开（ensure_clone_desktop + launch_in_clone 启动程序后），本工具把鼠标/键盘经 RDP 直接注入悬浮窗里的程序 ——
        不移动/不点击你真实桌面的鼠标，画面在悬浮窗实时可见。支持：移动鼠标、点击、右键/双击、滚轮、按组合键、输入文字（中文走剪贴板粘贴）、读写剪贴板。坐标=悬浮窗客户区像素，与悬浮窗画面一致。未打开桌面分身时，退化为无界面隔离桌面（CreateDesktop）纯后台操作。需在你真实桌面操作时直接指定。
      parameters:
        type: object
        properties:
          action:
            type: string
            description: >-
              操作类型：windows(列窗口) / find_window / window_rect / focus(把窗口置前) / move / click / right_click / middle_click /
              double_click / mouse_down / mouse_up / drag / scroll / type(逐字输入) / paste(剪贴板+Ctrl+V，长文本更快更稳) / press /
              hotkey / cursor_pos / screensize / clipboard_get / clipboard_set / steps(一次执行多步)
          x:
            type: number
            description: 横坐标（move/click/drag起点/scroll）
          y:
            type: number
            description: 纵坐标（move/click/drag起点/scroll）
          x2:
            type: number
            description: drag 终点横坐标
          y2:
            type: number
            description: drag 终点纵坐标
          button:
            type: string
            description: 按键：left(默认) / right / middle
            default: left
          double:
            type: boolean
            description: 是否双击，默认 false
            default: false
          delta:
            type: number
            description: scroll 滚动量：负数向下，正数向上，120 = 一格
          text:
            type: string
            description: type/paste/clipboard_set 的文本（中文可用）
          key:
            type: string
            description: press 的按键名：enter/tab/esc/backspace/space/ctrl/shift/alt/win/方向键/F1~F12、单个字母数字，或数字虚拟键码
          keys:
            type: array
            items:
              type: string
            description: hotkey 组合键数组，如 ["ctrl","c"]、["win","r"]
          window:
            type: string
            description: 窗口标题关键字：填了会先把该窗口置前再操作（type/press/hotkey/click/drag/scroll 都支持），强烈建议填，避免打到别的窗口
          title:
            type: string
            description: find_window / window_rect / focus 用：窗口标题关键字
          keyword:
            type: string
            description: windows 用：只列标题包含该关键字的窗口
          ms:
            type: number
            description: steps 里的 wait 等待毫秒数，默认 300
          delay:
            type: number
            description: type 每字符间隔毫秒，默认 15
          steps:
            type: array
            items:
              type: object
            description: steps 批量动作，如 [{action:"focus",window:"贪吃蛇"},{action:"click",x:100,y:200},{action:"type",text:"hello"}]
          dryRun:
            type: boolean
            description: true = 只预演不真操作（推荐第一次先用它确认坐标和窗口名）
            default: false
        required:
          - action
  - type: function
    function:
      name: launch_in_clone
      description: >-
        【在桌面分身中启动程序】在桌面分身（隔离桌面悬浮窗）中启动程序，程序跑在独立子会话里，画面实时显示在右下角悬浮小窗（用户能看到），用户当前桌面不受影响。适合编译、跑测试、装依赖、跑脚本、长时间构建等任务。标准流程：ensure_clone_desktop
        → launch_in_clone →（需要交互才 control_computer）。要拿输出就让命令重定向到文件再 read_file，或看退出码。⚠️ 用户用中文说程序名（如"波点音乐"）时，必须先通过系统搜索或
        web_search 解析出真实 exe 路径，不要直接传猜测的英文 exe 名。
      parameters:
        type: object
        properties:
          command:
            type: string
            description: >-
              要启动的程序命令行，如 "notepad.exe"、"chrome.exe https://example.com"。用户用中文说程序名（如"波点音乐"）时，必须先解析出真实 exe 路径再传，不要瞎猜
              bodianmusic.exe 之类。
          title:
            type: string
            description: （可选）启动后要查找的窗口标题关键字，用于返回 hwnd 供后续 control_computer 使用
          wait:
            type: number
            description: 启动后等待窗口创建的毫秒数，默认 2000
            default: 2000
        required:
          - command
  - type: function
    function:
      name: ensure_clone_desktop
      description: >-
        【打开/启动桌面分身】当用户说"打开桌面分身"、"启动桌面分身"、"打开分身"、"分身"时直接调用。作用：在主程序输入栏上方弹出一个无标题栏的悬浮预览小窗（隔离桌面），用户能看到里面的实时画面。不要先启动示例程序，也不要问用户要启动什么。要启动程序用
        launch_in_clone。
      parameters:
        type: object
        properties:
          openPreview:
            type: boolean
            description: 是否同时打开独立预览窗，默认 true
            default: true
  - type: function
    function:
      name: launch_project
      description: >-
        【启动被测项目·仅用于端到端测试，会在用户桌面启动程序】自动识别项目类型并拉起：Node/Python/Rust/Go/Java/VS → 跑对应启动命令；只有 html/css/js 的静态网页 →
        自动起本地静态服务并在默认浏览器打开（返回 url 和页面标题）。⚠️ 网页项目和源码项目都不要去找 exe 启动，项目里躺着的 setup.exe / chrome.exe / node.exe
        跟被测程序无关（已被自动排除）。先在 AI 工作模式里选择项目（决定工作目录），不传 dir 就用当前工作目录。返回类型、启动方式、url、窗口标题提示、是否真的拉起来了。⚠️⚠️⚠️
        【禁止用于桌面分身】用户要求"桌面分身/分身/隔离桌面"时绝对不能用此工具——它会在用户桌面直接启动程序，必须用 launch_in_clone。
      parameters:
        type: object
        properties:
          dir:
            type: string
            description: 项目目录绝对路径（省略则用当前 AI 工作目录）
          method:
            type: string
            description: 启动方式：auto(默认，网页=本地服务+浏览器打开，其它=跑启动命令) / command(跑启动命令) / open(直接打开已编译的 exe；网页项目会被拒绝) / detect(仅识别不启动)
            default: auto
          install:
            type: boolean
            description: true 时若依赖缺失先装依赖再启动（Node/Python），默认 false
            default: false
          preferExe:
            type: boolean
            description: auto 模式下优先直接打开已编译的 exe（适合测试打包后的成品；网页项目会被拒绝），默认 false
            default: false
