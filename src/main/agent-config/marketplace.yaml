# ============================================================================
# marketplace.yaml —— 本地智能商城目录（出厂内置，无服务器）
# ============================================================================
# 语义：**商城目录内置在应用里**，条目通过**公开 URL / 包管理器**拉取，无需后端。
#   · source.kind = github  → 有 git 就从 GitHub 拉（raw 单文件 / codeload 整目录 zip）
#   · source.kind = url    → git 没有就拉其他社区资源（任意公开 https 单文件或 zip）
#   · source.kind = inline → 定义内嵌在目录里，无需网络（智能体角色等）
#
# 图标（icon）一律用**条目的真实来源图标**，不自己编：
#   · 技能（来自 anthropics/skills 官方技能库）→ 用该仓库/作者的真实头像
#   · MCP（来自 modelcontextprotocol 官方服务器）→ 用 MCP 官方 logo
#   · 智能体（应用内置角色）→ 用角色本身的 emoji（与 roles.yaml 的预设角色一致）
#
# 三类条目：
#   · skill（能力包）：装进 data/skills/<id>/（SKILL.md + 可选资产），注入 AI 按需调用
#   · mcp：MCP 服务器配置，装进 data/marketplace/mcp.yaml，并入 mcpManager，一键启用
#   · agent：智能体角色，写入 data/agent_roles.json（Agent 设置可选）
#
# ⚠️ 安全：只走 https、带大小上限；zip 解压有路径穿越/炸弹防护；MCP 命令沿用白名单。
# ============================================================================
