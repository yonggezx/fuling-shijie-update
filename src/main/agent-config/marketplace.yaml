  # ── 魔搭技能（技能中心 Skills Central 真实技能）────────────────────────────
  - id: skill-ms-studio-deploy
    type: skill
    name: 魔搭创空间部署
    category: dev
    version: "1.0.0"
    description: 魔搭技能中心（Skills Central）真实技能：把本地应用部署到魔搭创空间、获取运营 URL、接入官方 MCP 服务端点，含 .cn/.ai 双站令牌规则。
    icon: {kind: emoji, value: "🚀"}
    source:
      kind: inline
      skillMd: |-
        ---
        name: modelscope-studio-deploy
        description: 部署本地应用到魔搭创空间（ModelScope Studio），获取运营 URL 并接入官方 MCP 服务端点
        source: https://modelscope.cn/skills/kelseye/modelscope-studio-deploy
        ---

        你负责把用户的本地应用/服务部署到魔搭创空间（ModelScope Studio），并处理部署后的访问与 MCP 接入。

        ## 前置条件
        - 用户有魔搭账号和令牌（TOKEN）。**国内站（modelscope.cn）与国际站（modelscope.ai）令牌互相独立、不可互通**，操作哪个站就用哪个站的令牌。
        - 令牌绝不写进配置明文：提示用户存入凭证库，调用时用 `${secret:modelscope-token}` 方式引用。
        - 需要网络请求时用内置 web_fetch / http 工具，请求头统一带 `Authorization: Bearer ${TOKEN}`。

        ## 部署流程
        1. 确认目标站点（.cn / .ai）与创空间名称；若还没有空间，先在魔搭创空间创建。
        2. 通过魔搭 OpenAPI 发起部署（无可用链接时）：
           `POST https://${DOMAIN}/openapi/v1/mcp/servers/modelscope/modelscope-mcp-server/deploy`，请求头带 Bearer TOKEN，请求体 `{"transport_type": "sse"}`。
        3. 部署后获取运营 URL：请求参数带 `get_operational_url=true`，从响应中取出可访问的运营地址。
        4. 若需 MCP 方式接入：官方 MCP 服务端点形如 `/mcp/servers/modelscope/modelscope-mcp-server`（域名按站点替换），按 SSE 传输接入。
        5. 若 MCP 接入不可用或配置困难，全程改用 HTTP API 完成同样操作，并如实告知用户。

        ## 安全与边界
        - 只操作用户明确授权的空间与令牌；不读取、不外发其他密钥。
        - 部署动作（创建/覆盖/下线）前先向用户确认目标和影响。
        - 遇到鉴权失败，提示检查令牌是否对应正确站点（.cn 与 .ai 不通用）。

