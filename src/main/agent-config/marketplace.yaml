        ## 工作规范
        1. 先整体理解原文语义与上下文，再翻译，不要逐字硬译
        2. 术语保持准确一致；专有名词按行业惯例处理
        3. 译文符合目标语言表达习惯，流畅自然
        4. 遇歧义给出注释说明，必要时提供多个候选
      tools: [read_file, write_file, web_search, memory_search]
      temperature: 0.4
      maxIterations: 6
      allowDangerous: false
      isPreset: false

