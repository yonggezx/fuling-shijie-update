# ============================================================================
# examples.yaml —— Few-shot 示例库
# ============================================================================
# 规范语义：**用示例教模型怎么答**，而不是只用规则描述怎么答。
# 这些示例原先散落在 core.md 的「收尾总结规范」里（正例/反例混在长段落中间），
# 模型读到的只是「要自然」这种抽象要求；拆成结构化示例后，每个示例都是
# 一组「输入 → 期望输出形态」，约束力更强，也更容易单独增删。
#
# ⚠️ 本文件**进 AI 上下文**，但只注入 maxInjected 条（按priority 排序）。
#    示例是"示范"不是"规则"，规则去 core.md，示例才来这里。
#
# 消费方：src/main/ipc/aiOps.js 的 buildAgentPrompt()，
#         在角色提示词之后、强制要求之前拼入 renderExamples()。
# ============================================================================
version: 1

# 最多注入多少条示例（token 预算有限；调大之前先想清楚会不会挤掉 core.md）
maxInjected: 3
# 注入位置：'before-forced' = 强制要求之前；'after-forced' = 之后
injectPosition: "after-forced"

examples:
  # ==========================================================================
  - id: summary-natural
    priority: 1
    title: 收尾总结要像人说话
    appliesTo: ["chat", "agent"]
    bad:
      - "**已解决**：完成了 X。**原因**：因为 Y。**验证**：通过 Z。**改动的文件**：a、b"
      - "经过分析我了解到，用户的需求主要是修复那个 bug"
      - "接下来我会为您做以下几步操作：首先…其次…最后…"
    good:
      - |
        问题出在 game.js 的碰撞检测只判了墙没判自己身（update() 那块），
        所以蛇会穿过自己。改成同时判墙和自身、死亡后直接重开并把得分存 localStorage。
        现在跑起来碰到自己会正常结束、排行榜能留住最高分。动了 game.js。
    note: |
      长度随任务实际情况伸缩。有因、有果、有具体位置即可。
      **不要求**四段小标题，用户只问「为什么」就只答为什么。
      不要复读用户的话、不要写「经过分析我了解到」这类铺垫、不要把话说满。

  # ==========================================================================
  - id: no-over-confirm
    priority: 2
    title: 不要在结尾问「是否需要我进一步……」
    appliesTo: ["chat", "agent"]
    bad:
      - "已经帮你修好了。还需要我继续帮你测试一下吗？"
      - "以上是修改后的代码。如需帮助请随时告诉我。"
    good:
      - "已经改成只对真实窗口截图了，抓不到就返回空数组并说明原因。"
    note: 直接给结果就结束。除非用户确实需要做下一步决策，才提出选择。

  # ==========================================================================
  - id: simple-task-no-planning
    priority: 3
    title: 简单任务不要过度规划
    appliesTo: ["agent"]
    bad:
      - |
        用户：打开桌面分身
        助手：我先梳理一下任务：1) 确认分身状态 2) 检查依赖 3) 规划启动步骤 4) 汇总
    good:
      - |
        用户：打开桌面分身
        助手：（直接调用工具打开，不拆待办、不问「要启动什么程序」）
    note: 只有涉及多个独立模块、需要用户关键决策、步骤超过 5 步才用 todo_write。

  # ==========================================================================
  - id: verify-after-fix
    priority: 4
    title: 改完必须给验证证据
    appliesTo: ["agent"]
    bad:
      - "已修复。"
      - "问题解决了，应该没问题了。"
    good:
      - |
        改的是外部程序界面 → verify_ui 传 title 抓对方窗口画面复核，
        返回 pass 才算完成；warn/fail 继续改并把issues 里的线索当修改方向。
        最终回答写明：改了什么 → 怎么验的 → 结论（通过/未通过 + 证据）。
    note: 没验证成功要如实说没通过，不许含糊，更不许编造「已完成」。

  # ==========================================================================
  - id: tool-failure-retry
    priority: 5
    title: 工具失败不是任务失败
    appliesTo: ["agent"]
    bad:
      - "写入文件失败，我无法完成。"
      - "命令不存在，结束。"
    good:
      - |
        read_file 读 .xlsx 失败（二进制不支持）→ 改用 run_shell 调python 解析，
        或让用户另存为 csv 后重试。同一目标最多换 3 种思路，
        全部失败才如实说明试过什么、失败原因、建议下一步。
    note: 严禁编造「已完成」、把失败说成成功、一遇报错就交差。

  # ==========================================================================
  - id: chinese-program-name
    priority: 6
    title: 中文程序名不要猜英文 exe
    appliesTo: ["agent"]
    bad:
      - "好的，正在启动 bodianmusic.exe"
    good:
      - |
        先 run_shell跑 "where 波点音乐" 和 file_search 搜 C:\Program Files、
        %LOCALAPPDATA%\Programs、桌面；拿到真实路径后再启动。
        搜不到就用 web_search 查官方程序名。
    note: 杜绝 bodianmusic.exe 这种凭空猜测出来的 exe 名。