name: 跨平台发布

# 打 tag 触发：git tag v1.0.9 && git push origin v1.0.9
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: 安装依赖
        run: npm ci
      - name: 打包 Windows
        run: npm run build:win-dir
      - name: 创建 Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.exe

  build-linux:
    runs-on: ubuntu-latest
    needs: build-windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools libfuse2
      - name: 安装依赖
        run: npm ci
      - name: 打包 Linux
        run: npm run build:linux
      - name: 上传到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/*.AppImage
            dist/*.deb

  build-macos:
    runs-on: macos-latest
    needs: build-windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: 安装依赖
        run: npm ci
      - name: 打包 macOS
        run: npm run build:mac
      - name: 上传到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/*.dmg
            dist/*.zip

  # ===== 官网同步 =====
  # 发布（打 v* tag）后，把官网 index.html 里的下载链接版本号
  # （浮灵饰界_Setup_v*.exe、-*.dmg、-*.AppImage、APP_VERSION 等）更新为本次 tag 版本，
  # 并 push 到官网仓库 fuling-shijie-website。
  # 需要 GitHub Actions secret：WEBSITE_TOKEN（对 fuling-shijie-website 有写权限的 PAT）。
  sync-website:
    runs-on: ubuntu-latest
    needs: [build-linux, build-macos]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
        with:
          path: app
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 检出官网仓库
        uses: actions/checkout@v4
        with:
          repository: yonggezx/fuling-shijie-website
          token: ${{ secrets.WEBSITE_TOKEN }}
          path: website
      - name: 更新官网下载链接到最新版本
        run: node app/scripts/sync-website-version.js --version=${{ github.ref_name }} --path=website/index.html
      - name: 提交并推送官网
        run: |
          cd website
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "chore(website): 更新下载链接到 ${{ github.ref_name }}"
            git push
          else
            echo "官网无变更，跳过推送"
          fi
